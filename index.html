<!doctype html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta property="og:description" content="为电商与自有客户渠道提供自然、专业的智能客服，围绕您的业务构建专属知识库。即将上线。" />
    <meta property="og:url" content="https://inkeai.com/" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Inke AI — 面向电商的 AI 智能客服" />
    <meta name="twitter:description" content="为电商与自有客户渠道提供自然、专业的智能客服，围绕您的业务构建专属知识库。即将上线。" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured data for search engines and AI crawlers (GEO) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://inkeai.com/#organization",
            "name": "Inke AI",
            "url": "https://inkeai.com/",
            "email": "inkeai@outlook.com",
            "description": "Inke AI builds AI customer support for e-commerce and owned customer channels, with a knowledge base built around each business."
          },
          {
            "@type": "WebSite",
            "@id": "https://inkeai.com/#website",
            "url": "https://inkeai.com/",
            "name": "Inke AI",
            "inLanguage": ["zh-CN", "en"],
            "publisher": { "@id": "https://inkeai.com/#organization" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="site-shell">
      <header class="site-header">
        <a class="brand" href="./" aria-label="Inke AI home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>Inke AI</span>
        </a>
        <button class="lang-toggle" type="button" id="lang-toggle" aria-label="切换语言 / Switch language">
          <span class="lang-option" data-lang="zh">中</span>
          <span class="lang-divider" aria-hidden="true">/</span>
          <span class="lang-option" data-lang="en">EN</span>
        </button>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-art" aria-hidden="true">
          <div class="art-ring art-ring-one"></div>
          <div class="art-ring art-ring-two"></div>
          <div class="art-core"></div>
          <span class="art-star star-one"></span>
          <span class="art-star star-two"></span>
          <span class="art-star star-three"></span>
        </div>

        <div class="hero-copy">
          <p class="eyebrow"><span class="eyebrow-text" data-i18n="eyebrow">状态 / 即将上线</span></p>
          <h1 id="hero-title"><span class="title-line" data-i18n="title1">我们即将</span><span class="title-line" data-i18n="title2">与您见面。</span></h1>
          <p class="hero-intro" data-i18n="intro">Inke AI 为电商与您的自有客户渠道带来自然、专业的智能客服，并围绕您的业务构建专属知识库。</p>
          <a class="contact-link" href="mailto:inkeai@outlook.com?subject=Hello%20Inke%20AI">
            <span class="contact-label" data-i18n="contactLabel">保持联系</span>
            <span class="contact-address">inkeai@outlook.com</span>
            <span class="contact-arrow" aria-hidden="true">↗</span>
          </a>
        </div>

        <div class="hero-footer">
          <p class="scroll-note"><span class="scroll-line" aria-hidden="true"></span><span class="scroll-note-text" data-i18n="comingSoon">即将上线</span></p>
          <p class="hero-caption" data-i18n="caption">即将与您见面。</p>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var translations = {
          zh: {
            eyebrow: "状态 / 即将上线",
            title1: "我们即将",
            title2: "与您见面。",
            intro: "Inke AI 为电商与您的自有客户渠道带来自然、专业的智能客服，并围绕您的业务构建专属知识库。",
            contactLabel: "保持联系",
            comingSoon: "即将上线",
            caption: "即将与您见面。"
          },
          en: {
            eyebrow: "Status / coming soon",
            title1: "We are almost",
            title2: "ready for you.",
            intro: "Inke AI brings natural, knowledgeable customer support to e-commerce and your own customer channels, with a knowledge base built around your business.",
            contactLabel: "Keep in touch",
            comingSoon: "Coming soon",
            caption: "coming shortly."
          }
        };

        var meta = {
          zh: {
            title: "Inke AI — 即将上线",
            description: "Inke AI — 面向电商与自有客户渠道的 AI 智能客服，围绕您的业务构建专属知识库。即将上线。"
          },
          en: {
            title: "Inke AI — Coming soon",
            description: "Inke AI — AI customer support for e-commerce and your own customer channels, with a knowledge base built around your business. Coming soon."
          }
        };

        var STORAGE_KEY = "inke-lang";

        function applyLang(lang) {
          var dict = translations[lang];
          if (!dict) return;

          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
          document.title = meta[lang].title;

          var desc = document.querySelector('meta[name="description"]');
          if (desc) desc.setAttribute("content", meta[lang].description);

          var nodes = document.querySelectorAll("[data-i18n]");
          for (var i = 0; i < nodes.length; i++) {
            var key = nodes[i].getAttribute("data-i18n");
            if (dict[key]) nodes[i].textContent = dict[key];
          }

          var toggle = document.getElementById("lang-toggle");
          if (toggle) {
            toggle.setAttribute("data-active", lang);
            toggle.setAttribute("aria-label", lang === "zh" ? "切换语言 / Switch language" : "Switch language / 切换语言");
          }

          try { localStorage.setItem(STORAGE_KEY, lang); } catch (e) { /* storage unavailable */ }
        }

        function initialLang() {
          var saved = null;
          try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) { /* storage unavailable */ }
          if (saved === "en" || saved === "zh") return saved;
          return "zh";
        }

        var current = initialLang();
        applyLang(current);

        var toggle = document.getElementById("lang-toggle");
        if (toggle) {
          toggle.addEventListener("click", function () {
            current = current === "zh" ? "en" : "zh";
            applyLang(current);
          });
        }
      })();
    </script>
  </body>
</html>
